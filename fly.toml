# fly.toml app configuration file generated for pcos-risk-zulkar-2026 on 2026-08-30T00:01:38+06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pcos-risk-zulkar-2026'
primary_region = 'sin'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '20s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
